minimum_pre_commit_version: "4.6.0"
default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit, pre-push]

exclude: ^\.project/

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-case-conflict
      - id: check-json
      - id: check-merge-conflict
      - id: check-yaml
      - id: debug-statements
      - id: end-of-file-fixer
      - id: trailing-whitespace

  # Keep this rev in step with the ruff pin in requirements-dev.txt. When they drift,
  # pre-commit and a local `ruff check` are two different binaries with two different
  # rule sets, and a commit can pass one while failing the other.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.0
    hooks:
      - id: ruff-check
      - id: ruff-format

  - repo: local
    hooks:
      - id: yamllint
        name: yamllint
        entry: yamllint
        language: system
        types: [yaml]
      - id: marketplace-validate
        name: validate marketplace metadata
        entry: python scripts/johns-os-marketplace.py validate
        language: system
        pass_filenames: false
        always_run: true
      - id: lifecycle-validate
        name: validate engineering lifecycle plugin
        entry: python engineering-lifecycle/bin/eng-life validate
        language: system
        pass_filenames: false
        always_run: true
      # Blocks on the closed-namespace classes only - a plugin, skill, agent,
      # command or marketplace that does not exist. Path references are advisory
      # and reported by the whole-repo run in validate-repo.py, not here.
      - id: reference-check
        name: check documentation references resolve
        entry: python -B engineering-lifecycle/scripts/reference-check.py --root .
        language: system
        pass_filenames: false
        files: \.md$
