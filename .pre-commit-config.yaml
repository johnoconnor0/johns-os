minimum_pre_commit_version: "4.6.0"
default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit, pre-push]

exclude: ^(?:\.project/|_unreleased/)

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-case-conflict
      - id: check-json
      - id: check-merge-conflict
      - id: check-yaml
      - id: debug-statements
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.22
    hooks:
      - id: ruff-check
      - id: ruff-format

  - repo: local
    hooks:
      - id: yamllint
        name: yamllint
        entry: yamllint
        language: system
        types: [yaml]
      - id: marketplace-validate
        name: validate marketplace metadata
        entry: python scripts/johns-os-marketplace.py validate
        language: system
        pass_filenames: false
        always_run: true
      - id: lifecycle-validate
        name: validate engineering lifecycle plugin
        entry: python engineering-lifecycle/bin/eng-life validate
        language: system
        pass_filenames: false
        always_run: true
