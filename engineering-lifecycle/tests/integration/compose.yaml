# Live servers for the schema-introspect check.
#
# Credentials here are fixtures for a throwaway container on a private network.
# They are not secrets and are deliberately obvious, so nobody mistakes one for
# a real one and nobody is tempted to move it into a .env that then gets shared.
name: johnsos-introspect

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: fixture-root-pw
      MYSQL_DATABASE: introspect
      MYSQL_USER: fixture
      MYSQL_PASSWORD: fixture-pw
    volumes:
      - ./seed/mysql.sql:/docker-entrypoint-initdb.d/seed.sql:ro
    healthcheck:
      # --silent so a failing probe does not spam the compose log every 5s.
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: introspect
      POSTGRES_USER: fixture
      POSTGRES_PASSWORD: fixture-pw
    volumes:
      - ./seed/postgres.sql:/docker-entrypoint-initdb.d/seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fixture -d introspect"]
      interval: 5s
      timeout: 5s
      retries: 30

  mssql:
    # No arm64 image exists for this. On Apple Silicon the harness skips SQL
    # Server rather than silently testing an emulated engine.
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Fixture-pw-1234"
      MSSQL_PID: Developer
    healthcheck:
      # -C trusts the container's self-signed certificate. sqlcmd 18+ defaults to
      # encrypt=true and refuses it otherwise - which is exactly the failure this
      # suite exists to surface in the script under test.
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1",
        ]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s

  harness:
    build:
      context: .
      dockerfile: Dockerfile.harness
    depends_on:
      mysql: { condition: service_healthy }
      postgres: { condition: service_healthy }
      mssql: { condition: service_healthy }
    volumes:
      # The script under test, read-only: the harness must not be able to alter
      # what it is checking.
      - ../../scripts:/work/scripts:ro
      - ./seed:/work/seed:ro
    working_dir: /work
    entrypoint: ["sleep", "infinity"]
