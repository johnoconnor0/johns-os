# Starter eval suite for build-project-dashboard. Review and tune judge_criteria + edge expectations.
skill: build-project-dashboard
description: "Verifies build-project-dashboard activates on lifecycle status/dashboard requests and produces the project dashboard artifacts."
test_cases:
  - id: activate-positive-1
    kind: activation
    description: should fire when the user asks for a project status view
    user_input: "Give me a project status view of where this initiative is in the engineering lifecycle."
    expected_activation: true
  - id: activate-positive-2
    kind: activation
    description: should fire when the user asks for a lifecycle dashboard summary
    user_input: "Build a project dashboard summarising artifacts, risks, open action items, and release readiness."
    expected_activation: true
  - id: activate-positive-3
    kind: activation
    description: should fire when the user asks for the current engineering state before planning
    user_input: "Before we plan the next sprint, summarise the current engineering state, hygiene status, and decisions."
    expected_activation: true
  - id: activate-negative-1
    kind: activation
    description: should NOT fire when the user wants a discovery brief instead
    user_input: "Turn this rough product idea into a discovery brief with users, goals, and an MVP boundary."
    expected_activation: false
  - id: activate-negative-2
    kind: activation
    description: should NOT fire on an unrelated coding question
    user_input: "How do I configure SSH key forwarding on Windows?"
    expected_activation: false
  - id: functional-1
    kind: functional
    description: produces the project dashboard artifacts described in examples/example-dashboard-data.json
    user_input: "Build the project dashboard for the example-checkout initiative."
    expected_outputs:
      - kind: file_created
        path_glob: "**/dashboards/project-dashboard.html"
      - kind: file_created
        path_glob: "**/dashboards/dashboard-data.json"
      - kind: contains
        text: "missing_artifact_groups"
    judge_criteria:
      - "Australian English used throughout"
      - "Artifact status is derived from content/role, not invented to imply completion"
      - "Stale freshness flags and missing artifact groups remain visible"
      - "Open action items, risks, and follow-ups are surfaced rather than hidden"
    timeout_seconds: 300
  - id: edge-empty-argument
    kind: edge-case
    description: handles empty input gracefully
    user_input: ""
    expected_error: "empty-argument"
  - id: edge-no-lifecycle-state
    kind: edge-case
    description: handles a project with no .project/.engineering lifecycle state
    user_input: "Build the project dashboard for an initiative that has no lifecycle artifacts yet."
    expected_error: "missing-input"
