# Rewritten when the skill moved onto findings.json. The seed suite this replaces
# used "Read this for me" as its canonical activation case and still carried
# `<REPLACE-with-realistic-input-for-audit-resolver>` as the functional input, so
# neither the positive cases nor the functional case tested anything real.

skill: audit-resolver
description: "Turn a plan-completion audit's findings into executed, verified fixes"

test_cases:
  - id: activate-positive-canonical
    kind: activation
    description: "should fire on the canonical use case"
    user_input: "Resolve the findings from the last audit"
    expected_activation: true

  - id: activate-positive-paraphrase
    kind: activation
    description: "should fire when the ask is phrased as acting on an audit"
    user_input: "Go through the audit report and fix what it found"
    expected_activation: true

  - id: activate-positive-name-mention
    kind: activation
    description: "should fire when the skill is named"
    user_input: "run audit-resolver"
    expected_activation: true

  - id: activate-negative-unrelated
    kind: activation
    description: "should NOT fire on an unrelated request"
    user_input: "how do I configure SSH key forwarding on Windows?"
    expected_activation: false

  - id: activate-negative-run-the-audit
    kind: activation
    description: "should NOT fire when the user wants the audit itself, not its resolution"
    user_input: "audit this plan against the implementation"
    expected_activation: false

  - id: functional-golden
    kind: functional
    description: "loads a structured audit, triages it, and writes a ledger"
    user_input: "Resolve the findings from the latest audit, dry run only"
    expected_outputs:
      - kind: file_created
        path_glob: ".project/audits/audit-resolver/*/audit-resolver-ledger.md"
    judge_criteria:
      - "No American spellings in the narrative (color, optimize, behavior, organize, center, analyze) - Australian or neutral both pass"
      - "The findings were loaded via scripts/resolver.py, not by scraping the markdown report"
      - "Families that did not run are reported to the user, with not-applicable distinguished from not-checked"
      - "Every delegation target named is an agent or skill this marketplace actually ships"
      - "No install command names a marketplace other than the one in use"
      - "The ledger records the verifier command that ran and its result, or says the batch was applied unverified"
    timeout_seconds: 240

  - id: edge-no-audit-present
    kind: edge-case
    description: "stops cleanly when no audit has been run"
    user_input: "Resolve the audit findings in a repository that has never been audited"
    expected_error: "no-audit-found"

  - id: edge-zero-findings
    kind: edge-case
    description: "reports families that did not run even when there is nothing to fix"
    user_input: "Resolve the findings from an audit that found nothing"
    expected_error: "nothing-to-do"

  - id: edge-empty-input
    kind: edge-case
    description: "handles empty input gracefully"
    user_input: ""
    expected_error: "empty-argument"
