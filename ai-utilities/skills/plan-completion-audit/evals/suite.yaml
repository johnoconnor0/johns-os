# Rewritten when the skill was rebuilt to be plan-derived. The generated suite this
# replaces still carried `<replace-with-real-path-to-project-root-or-plan-file>` as
# the functional case's input, so that case had never once been runnable.

skill: plan-completion-audit
description: "Audit a plan against what was built, deriving checks from the plan and the detected stack"

test_cases:
  - id: activate-positive-canonical
    kind: activation
    description: "should fire on the canonical use case"
    user_input: "Audit this plan against what we actually implemented"
    expected_activation: true
  - id: activate-positive-paraphrase
    kind: activation
    description: "should fire when the ask is phrased as a completion question"
    user_input: "Did we actually build everything in the implementation plan?"
    expected_activation: true
  - id: activate-positive-name-mention
    kind: activation
    description: "should fire when the skill is named"
    user_input: "run plan-completion-audit"
    expected_activation: true
  - id: activate-negative-unrelated
    kind: activation
    description: "should NOT fire on an unrelated question"
    user_input: "how do I configure SSH key forwarding on Windows?"
    expected_activation: false
  - id: activate-negative-review-without-plan
    kind: activation
    description: "should NOT fire on a plain code review with no plan in play"
    user_input: "review this function for bugs"
    expected_activation: false

  - id: functional-golden
    kind: functional
    description: "audits the committed fixture and gates its families on the fixture's stack"
    user_input: "Audit ai-utilities/tests/fixtures/tiny-python-repo against its PLAN.md"
    expected_outputs:
      - kind: file_created
        path_glob: ".project/audits/plan-completion-audit/*/findings.json"
      - kind: file_created
        path_glob: ".project/audits/plan-completion-audit/*/report.md"
    judge_criteria:
      - "No American spellings in the narrative (color, optimize, behavior, organize, center, defense, analyze) - Australian or neutral both pass"
      - "The report contains NO Supabase, RLS or frontend-backend alignment section: the fixture has no database and no frontend"
      - "Every family that did not run states a reason, and not-applicable is visibly distinct from not-checked"
      - "The plan inventory lists items 1.1, 1.2 and 2.1 extracted by the numbered-headings extractor"
      - "No completion percentage is asserted unless the plan items were actually assessed"
      - "Findings cite a file and, where one exists, a line"
    timeout_seconds: 240

  - id: functional-table-plan
    kind: functional
    description: "reads a plan stated in markdown tables, and says what it did not account for"
    user_input: "Audit ai-utilities/tests/fixtures/table-plan-repo against its PLAN.md"
    expected_outputs:
      - kind: file_created
        path_glob: ".project/audits/plan-completion-audit/*/findings.json"
    judge_criteria:
      - "The inventory holds the five numbered table rows, extracted by the `table` extractor"
      - "The staging checklist in Part 9 is NOT the inventory: it is an ordered list that would have won before a table extractor existed"
      - "The report names the section that states work but produced no plan items, rather than passing over it silently"
      - "No completion percentage is reported while `plan.coverage.confident` is false"
    timeout_seconds: 240

  - id: edge-no-plan
    kind: edge-case
    description: "stops and asks rather than auditing against an invented inventory"
    user_input: "Audit a directory that contains no plan document at all"
    expected_error: "no-plan-found"
  - id: edge-empty-input
    kind: edge-case
    description: "handles empty input gracefully"
    user_input: ""
    expected_error: "empty-argument"
  - id: edge-nonexistent-target
    kind: edge-case
    description: "handles a target that does not exist"
    user_input: "audit this-target-definitely-does-not-exist-xyz"
    expected_error: "target-not-found"
