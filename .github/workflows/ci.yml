name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13"]
        # This codebase is developed on Windows and its guards match Windows
        # commands (Remove-Item, PowerShell paths), so Linux-only CI could not
        # see a whole class of breakage. Lint and format run once, on Linux;
        # every OS runs the suites.
        exclude:
          - os: windows-latest
            python-version: "3.13"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install development tools
        run: python -m pip install -r requirements-dev.txt

      - name: Run pre-commit hooks
        if: runner.os == 'Linux'
        run: pre-commit run --all-files

      - name: Run repository validation
        run: python scripts/validate-repo.py
