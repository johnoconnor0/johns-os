name: Dashboard E2E

# Opt-in, and separate from CI on purpose: this is the only thing in the repo
# that needs Node and a browser download, so it must not slow every push. It runs
# when the dashboard renderer or its specs change, and on demand.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'engineering-lifecycle/scripts/sync-ledger.py'
      - 'engineering-lifecycle/scripts/build-dashboard-fixture.py'
      - 'engineering-lifecycle/tests/e2e/**'
      - '.github/workflows/e2e.yml'

permissions:
  contents: read

jobs:
  dashboard:
    name: Dashboard renders and filters
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engineering-lifecycle/tests/e2e

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Generate the dashboard fixture
        run: npm run fixture

      - name: Run specs
        run: npx playwright test

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: engineering-lifecycle/tests/e2e/playwright-report/
          retention-days: 7
